<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="CKG Benchmark: Compact Knowledge Graphs versus RAG and GraphRAG">
  <rect width="1200" height="260" fill="#ffffff"/>
  <rect x="0" y="0" width="6" height="260" fill="#1f4e79"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="48" y="86" font-size="46" font-weight="700" fill="#1a1a1a" letter-spacing="-0.5">CKG Benchmark</text>
    <text x="48" y="120" font-size="17" fill="#444">Benchmarking knowledge retrieval architectures: RAG, GraphRAG, and Compact Knowledge Graphs</text>
    <text x="48" y="146" font-size="14" fill="#777">Same queries · same model · same scorer · different knowledge representation</text>
    <g font-size="12" fill="#555">
      <text x="48" y="208">Yarmoluk &amp; McCreary, 2026</text>
      <text x="48" y="228" fill="#888">47 evaluated domains · 8,121 CKG queries · code MIT · data CC BY 4.0 · doi:10.5281/zenodo.21222965</text>
    </g>
  </g>
  <!-- Right: minimal schematic of a dependency DAG -->
  <g transform="translate(860,40)" stroke="#9aaec4" stroke-width="1.5" fill="none">
    <line x1="60" y1="40" x2="140" y2="90"/>
    <line x1="220" y1="40" x2="140" y2="90"/>
    <line x1="140" y1="90" x2="100" y2="150"/>
    <line x1="140" y1="90" x2="200" y2="150"/>
    <line x1="220" y1="40" x2="260" y2="110"/>
    <line x1="260" y1="110" x2="200" y2="150"/>
    <line x1="60" y1="40" x2="30" y2="110"/>
    <line x1="30" y1="110" x2="100" y2="150"/>
  </g>
  <g transform="translate(860,40)">
    <circle cx="60" cy="40" r="9" fill="#dbe4ee" stroke="#1f4e79" stroke-width="1.5"/>
    <circle cx="220" cy="40" r="9" fill="#dbe4ee" stroke="#1f4e79" stroke-width="1.5"/>
    <circle cx="30" cy="110" r="9" fill="#dbe4ee" stroke="#1f4e79" stroke-width="1.5"/>
    <circle cx="140" cy="90" r="11" fill="#1f4e79"/>
    <circle cx="260" cy="110" r="9" fill="#dbe4ee" stroke="#1f4e79" stroke-width="1.5"/>
    <circle cx="100" cy="150" r="9" fill="#dbe4ee" stroke="#1f4e79" stroke-width="1.5"/>
    <circle cx="200" cy="150" r="9" fill="#dbe4ee" stroke="#1f4e79" stroke-width="1.5"/>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#666">
      <text x="140" y="188" text-anchor="middle">ConceptID, ConceptLabel, Dependencies, TaxonomyID</text>
    </g>
  </g>
</svg>
